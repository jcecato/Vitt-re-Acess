<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Vittáre Acess™ — CRM do Paciente</title>
    <meta name="description" content="Aplicativo individual por paciente integrado ao ecossistema CRM Vittáre, centralizando consultas, evolução, exames, guias e protocolos com alta fidelidade e sincronização em tempo real." />
    <meta name="theme-color" content="#07070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="Vittáre Acess™ — CRM do Paciente" />
    <meta property="og:description" content="Aplicativo individual por paciente integrado ao ecossistema CRM Vittáre, centralizando consultas, evolução, exames, guias e protocolos com alta fidelidade e sincronização em tempo real." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.42.0/dist/tabler-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#07070d] text-white antialiased selection:bg-[#5eea8f] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              reg.update();
              console.log('📱 [Vittáre PWA] Service Worker atualizado:', reg.scope);
            })
            .catch(err => console.log('⚠️ [Vittáre PWA] Falha no Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
